services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PYTHON_GIL: ${PYTHON_GIL:-0}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    env_file:
      - path: .env
        required: false
