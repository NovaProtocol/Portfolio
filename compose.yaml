services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_main
    restart: unless-stopped
    environment:
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  documentation:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    container_name: portfolio_documentation
    restart: unless-stopped
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: portfolio_caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:7011:7011"
    networks:
      - default
      - gatekeeper
networks:
  default:
  gatekeeper:
    external: true
    name: gatekeeper
