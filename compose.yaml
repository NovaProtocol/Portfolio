services:
  portfolio_main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_main
    restart: unless-stopped
    ports:
      - "7010:7010"
    environment:
      PYTHON_GIL: ${PYTHON_GIL:-0}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      GATEKEEPER_INTERNAL: ${GATEKEEPER_INTERNAL:?GATEKEEPER_INTERNAL is required}
      LEETCODE_DB_DIR: /data
    volumes:
      - leetcode_data:/data
    networks:
      - default
      - gatekeeper
      - cloudflared-tunnel
    env_file:
      - path: .env
        required: false

networks:
  default:
  gatekeeper:
    external: true
    name: gatekeeper_default
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default

volumes:
  leetcode_data:
