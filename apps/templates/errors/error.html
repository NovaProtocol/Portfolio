{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} · Nova{% endblock %}
{% block content %}
<div class="container" style="min-height: calc(100vh - 280px); display:flex; align-items:center; justify-content:center; padding: 3rem 1rem;">
  <div style="text-align:center; max-width:520px; width:100%;">
    <div style="font-family:'JetBrains Mono',monospace; font-size: 5rem; font-weight:800; color: var(--accent); line-height:1; margin-bottom:.35rem;">{{ code }}</div>
    <h1 style="font-size:1.65rem; font-weight:700; margin-bottom:.6rem;">{{ title }}</h1>
    <p style="color: var(--text-secondary); margin-bottom:1.8rem;">{{ message }}</p>
    <a href="{{ url_for('home_blueprint.index') }}" class="btn-accent" style="display:inline-block;">Back to Home</a>
  </div>
</div>
{% endblock %}
