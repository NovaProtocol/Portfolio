<style>
    /* ============================================================
       THEME 1 — "Executive": two-column layout.
       Left column: education + certification (+ skills on page 2).
       Right column: summary + experience (+ projects on page 2).
       ============================================================ */
    {% if theme == 1 %}
    :root {
        --font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        --text-color: #2b2b2b;
        --accent: #c9a227;
        --accent-soft: transparent;
        --muted: #4a4a4a;
        --light-muted: #667085;
        --header-border: none;
        --h2-border: none;
        --name-color: #ffffff;
        --section-heading-bg: transparent;
    }
    .page { padding: 0; overflow: hidden; display: grid; grid-template-columns: 38% 62%; }
    body { font-size: 10px !important; }
    .resume-header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 6mm;
        background: #14213d;
        color: #fff;
        padding: 6mm 12mm;
        border-bottom: 3px solid var(--accent);
    }
    .resume-header h1 {
        font-size: 1.7em;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #ffffff !important;
        margin: 0 0 0.15rem;
    }
    .resume-header .contact-line,
    .resume-header .contact-line a { color: #d7dbe6 !important; font-size: 0.72em; }
    .resume-photo {
        width: 28mm;
        height: 28mm;
        border: 3px solid var(--accent);
        border-radius: 50%;
        margin: 0;
    }
    /* side column = education, certification, skills */
    .section-education, .section-certification, .section-skills {
        grid-column: 1;
        padding: 3mm 5mm 3mm 8mm;
        background: #f4f6fa;
        margin: 0;
    }
    /* main column = summary, experience, projects */
    .section-summary, .section-experience, .section-projects {
        grid-column: 2;
        padding: 3mm 8mm;
        margin: 0;
    }
    section h2 {
        color: #14213d;
        font-size: 0.78em;
        letter-spacing: 2px;
        border-bottom: 2px solid var(--accent);
        display: inline-block;
        padding-bottom: 0.1rem;
        margin-bottom: 0.3rem;
    }
    .entry .title { color: #14213d; }
    .entry { margin-bottom: 0.4rem; }
    .entry ul li { margin-bottom: 0.05rem; }
    .declaration { grid-column: 2; grid-row: auto; margin: 3mm 8mm 0; padding-top: 0.4rem !important; border-top: 2px solid var(--accent) !important; font-size: 0.9em; }
    .resume-projects-wrap { flex-direction: column; }

    /* ============================================================
       THEME 2 — "Editorial": stacked, wide teal top band,
       inline title/period rows, spaced sections.
       ============================================================ */
    {% elif theme == 2 %}
    :root {
        --font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        --text-color: #1f2937;
        --accent: #0d9488;
        --accent-soft: #e6f7f5;
        --muted: #374151;
        --light-muted: #6b7280;
        --header-border: none;
        --h2-border: none;
        --name-color: #111827;
        --section-heading-bg: transparent;
    }
    .page { padding: 0; overflow: hidden; }
    body { font-size: 10px !important; }
    .resume-header {
        background: linear-gradient(135deg, #0d9488, #0b6e66);
        color: #fff;
        padding: 6mm 18mm;
        margin: 0;
        border: none;
    }
    .resume-header h1 {
        font-size: 1.9em;
        font-weight: 600;
        color: #fff !important;
        margin: 0 0 0.15rem;
    }
    .resume-header .contact-line,
    .resume-header .contact-line a { color: #e6fffb !important; font-size: 0.78em; }
    .resume-photo {
        width: 26mm;
        height: 26mm;
        border-radius: 50%;
        border: 3px solid #fff;
    }
    .page > section {
        padding: 2.5mm 18mm;
        border-bottom: 1px solid #eef2f6;
    }
    section h2 {
        font-size: 0.8em;
        letter-spacing: 3px;
        color: var(--accent);
        text-transform: uppercase;
        margin-bottom: 0.4rem;
    }
    section h2::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        background: var(--accent);
        margin-right: 0.5rem;
    }
    .skill-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed #e5e7eb;
        padding-bottom: 0.2rem;
    }
    .skill-cat { color: var(--accent); font-weight: 600; }
    .declaration { margin: 3mm 18mm; border-top: 2px solid var(--accent) !important; }

    /* ============================================================
       THEME 3 — "Classic" (unchanged single column).
       ============================================================ */
    {% else %}
    :root {
        --font-family: Georgia, 'Times New Roman', Times, serif;
        --text-color: #1a1a1a;
        --accent: #1a1a1a;
        --accent-soft: transparent;
        --muted: #333;
        --light-muted: #555;
        --header-border: 3px double #1a1a1a;
        --h2-border: 1px solid #444;
        --name-color: #1a1a1a;
        --section-heading-bg: transparent;
    }
    {% endif %}

    body {
        color: var(--text-color);
        font-family: var(--font-family);
    }
    .resume-header h1 { color: var(--name-color); }
    .contact-line { color: var(--text-color); }
    .contact-line a { color: var(--text-color); }
    section h2 {
        color: var(--text-color);
        border-bottom: var(--h2-border);
    }
    .entry .title { color: var(--text-color); }
    .entry .org { color: var(--muted); }
    .entry .period { color: var(--light-muted); }
    .entry ul li { color: var(--muted); }
    .skill-cat { color: var(--text-color); }
</style>
