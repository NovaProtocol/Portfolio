<style>
    /* ============================================================
       THEME 1 — "Classic": RenderCV-inspired clean academic look.
       Centered name, contact row, thin rules, airy spacing.
       ============================================================ */
    {% if theme == 1 %}
    :root {
        --font-family: Georgia, 'Times New Roman', Times, serif;
        --text-color: #1a1a1a;
        --accent: #1a1a1a;
        --accent-soft: transparent;
        --muted: #333;
        --light-muted: #666;
        --header-border: none;
        --h2-border: 1px solid #1a1a1a;
        --name-color: #1a1a1a;
        --section-heading-bg: transparent;
    }
    body { font-size: 10.5px !important; line-height: 1.55 !important; }
    .page { padding: 18mm 20mm; }
    /* Centered header */
    .resume-header {
        text-align: center;
        border-bottom: none;
        padding-bottom: 1rem;
        margin-bottom: 1.2rem;
    }
    .resume-header h1 {
        font-size: 2.4em;
        font-weight: 700;
        color: #1a1a1a !important;
        letter-spacing: -0.5px;
        margin: 0 0 0.4rem;
    }
    .resume-photo { display: none; }
    .contact-line {
        font-size: 0.85em;
        margin: 0 0.5em !important;
        display: inline;
    }
    /* Turn contact into a horizontal row with dot separators */
    .resume-header .who > *:not(:last-child)::after {
        content: ' \00b7';
        margin: 0 0.5em;
        color: #888;
    }
    section { margin-bottom: 1.1rem; }
    section h2 {
        border-bottom: 1px solid #1a1a1a;
        font-size: 1em;
        letter-spacing: 0.5px;
        padding-bottom: 0.15rem;
        margin-bottom: 0.5rem;
    }
    .entry { margin-bottom: 0.6rem; }
    .entry:last-child { margin-bottom: 0; }
    .entry .head {
        justify-content: space-between;
        align-items: baseline;
    }
    .entry .title { font-weight: 700; font-size: 1.02em; }
    .entry .org {
        font-style: italic;
        font-weight: 400;
        font-size: 0.95em;
    }
    .entry .period { font-size: 0.88em; }
    .entry ul li { margin-bottom: 0.15rem; font-size: 0.95em; }
    .skill-row { display: flex; gap: 0.5em; margin-bottom: 0.4rem; }
    .declaration { border-top: 1px solid #1a1a1a !important; margin-top: 0.5rem; }

    /* ============================================================
       THEME 2 — "Moderncv": left accent bar, left-side dates,
       clean sans-serif.
       ============================================================ */
    {% elif theme == 2 %}
    :root {
        --font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
        --text-color: #1a1a1a;
        --accent: #0070c0;
        --accent-soft: transparent;
        --muted: #333;
        --light-muted: #666;
        --header-border: none;
        --h2-border: none;
        --name-color: #1a1a1a;
        --section-heading-bg: transparent;
    }
    body { font-size: 10px !important; line-height: 1.5 !important; }
    .page { padding: 14mm 16mm 14mm 20mm; border-left: 4px solid var(--accent); }
    /* Header: name left, contact inline */
    .resume-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        border-bottom: none;
        padding-bottom: 0.6rem;
        margin-bottom: 1rem;
    }
    .resume-header h1 {
        font-size: 2.4em;
        font-weight: 700;
        color: var(--accent) !important;
        margin: 0;
    }
    .resume-photo { display: none; }
    /* Contact as a row */
    .resume-header .who { display: flex; flex-direction: column; gap: 0.15rem; }
    .resume-header .contact-line { margin: 0 !important; font-size: 0.8em; }
    section { margin-bottom: 1rem; }
    section h2 {
        color: var(--accent);
        border-bottom: 2px solid var(--accent);
        font-size: 1em;
        font-weight: 700;
        padding-bottom: 0.15rem;
        margin-bottom: 0.5rem;
    }
    .entry .head {
        justify-content: space-between;
        align-items: baseline;
    }
    .entry .title { font-weight: 700; font-size: 1.02em; }
    .entry .org {
        font-style: italic;
        font-weight: 400;
        font-size: 0.95em;
    }
    .entry .period { font-size: 0.88em; }
    .entry ul li { margin-bottom: 0.15rem; font-size: 0.95em; }
    .skill-row { display: flex; gap: 0.5em; margin-bottom: 0.4rem; }
    .declaration { border-top: 2px solid var(--accent) !important; margin-top: 0.5rem; }

    /* ============================================================
       THEME 3 — "Executive" (original, unchanged)
       ============================================================ */
    {% else %}
    :root {
        --font-family: Georgia, 'Times New Roman', Times, serif;
        --text-color: #1a1a1a;
        --accent: #1a1a1a;
        --accent-soft: transparent;
        --muted: #333;
        --light-muted: #555;
        --header-border: 3px double #1a1a1a;
        --h2-border: 1px solid #444;
        --name-color: #1a1a1a;
        --section-heading-bg: transparent;
    }
    {% endif %}

    body {
        color: var(--text-color);
        font-family: var(--font-family);
    }
    .resume-header h1 { color: var(--name-color); }
    .contact-line { color: var(--text-color); }
    .contact-line a { color: var(--text-color); }
    section h2 {
        color: var(--text-color);
        border-bottom: var(--h2-border);
    }
    .entry .title { color: var(--text-color); }
    .entry .org { color: var(--muted); }
    .entry .period { color: var(--light-muted); }
    .entry ul li { color: var(--muted); }
    .skill-cat { color: var(--text-color); }
</style>
