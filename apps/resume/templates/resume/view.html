<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume - Khyles Gibrian Ramos</title>
    {% include "resume/_theme.html" %}
    <style>
        {# The body and the two page sheets, then the shared rules. This file is
           what the Save-as-PDF button prints, so its print rules have to agree
           with the shared padding: when they disagreed the page overflowed and
           the browser quietly cut the last section off the sheet. #}
        body { margin: 0; }
        .resume { margin: 0 auto; }
        .page {
            overflow: hidden;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        }
        .page + .page { margin-top: 2rem; }

        @page {
            size: A4;
            margin: 13mm 18mm;
        }
        @media print {
            @page { margin: 0; }
            body { margin: 0; padding: 0; }
            .resume { margin: 0; }
            .page {
                margin: 0;
                box-shadow: none;
                break-after: page;
            }
            .page:last-child { break-after: auto; }
            .page + .page { margin-top: 0; }
            /* Sections must not be split across a page break, which matters
               because these sheets are already exactly one page each. */
            section, .entry { page-break-inside: avoid; }
        }

        {% include "resume/_resume_css.html" %}
    </style>
</head>
<body>
<div class="resume">
    <div class="page">
    {% include "resume/_page1_body.html" %}
    </div><!-- /page 1 -->

    <div class="page">
    {% include "resume/_page2_body.html" %}
    </div><!-- /page 2 -->
</div>
</body>
</html>
