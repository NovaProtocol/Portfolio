<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume - Khyles Gibrian Ramos</title>
    {% include "resume/_theme.html" %}
    <style>
        {# The shared rules first, then the rules this file adds. Order matters:
           at equal specificity the later declaration wins, and this file's
           `@media print` block has to beat the shared sheet's `overflow: hidden`
           on `html, body` and `.page`. With the include at the end it did not,
           and the print stylesheet silently clipped an overrunning page instead
           of flowing it onto the next sheet. #}
        {% include "resume/_resume_css.html" %}

        body { margin: 0; }
        .resume { margin: 0 auto; }
        .page {
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        }
        .page + .page { margin-top: 2rem; }

        @page {
            size: A4;
            margin: 13mm 18mm;
        }
        @media print {
            @page { margin: 0; }
            body { margin: 0; padding: 0; }
            .resume { margin: 0; }
            .page {
                margin: 0;
                box-shadow: none;
                break-after: page;
            }
            .page:last-child { break-after: auto; }
            .page + .page { margin-top: 0; }
            /* The screen rule hides overflow so an iframe cannot grow a
               scrollbar. A print layout must never hide a page that overruns:
               an extra sheet is better than content the reader never sees. */
            html, body { overflow: visible; }
            .page { overflow: visible; }
            /* Sections must not be split across a page break, which matters
               because these sheets are already exactly one page each. */
            section, .entry { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
<div class="resume">
    <div class="page">
    {% include "resume/_page1_body.html" %}
    </div><!-- /page 1 -->

    <div class="page">
    {% include "resume/_page2_body.html" %}
    </div><!-- /page 2 -->
</div>
</body>
</html>
