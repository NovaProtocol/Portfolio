{% extends "base.html" %}

{% block title %}Resume | Nova{% endblock %}

{% block head_extra %}
<style>
    .resume-page {
        background: #e9ecef;
        padding: 2rem 0 4rem;
    }
    .resume-wrap {
        margin: 0 auto;
        max-width: 900px;
    }
    .resume-toolbar {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-bottom: 0.75rem;
    }
    .resume-toolbar button {
        min-width: 2.5rem;
        height: 2.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(10, 10, 15, 0.15);
        border-radius: 50%;
        background: #ffffff;
        color: var(--bg-primary);
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .resume-toolbar button:hover {
        background: var(--accent);
        color: var(--bg-primary);
        border-color: var(--accent);
    }
    /* The resume selector. It replaced a theme selector and then a variant
       selector, and it reads as text either way: the choice it makes is which
       resume you are sending, not how it looks. */
    .resume-toolbar .resume-btn {
        border-radius: 999px;
        min-width: 0;
        padding: 0 1rem;
        font-size: 0.9rem;
        font-weight: 600;
    }
    .resume-toolbar .resume-btn.active {
        background: var(--accent);
        color: var(--bg-primary);
        border-color: var(--accent);
    }
    .resume-toolbar .spacer { flex: 1; }
    .resume-sheet {
        width: 794px;
        display: block;
        margin: 0 auto 1.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        background: #ffffff;
    }
    .resume-sheet:last-child { margin-bottom: 0; }
    .resume-sheet iframe {
        width: 794px;
        height: 1123px;
        border: 0;
        display: block;
    }
    /* The sheet is a fixed A4 width, so on a phone it is wider than the page.
       Let it scroll inside its own wrapper rather than widening the document,
       and let the toolbar wrap instead of overflowing. */
    @media (max-width: 860px) {
        .resume-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 0.5rem;
        }
        .resume-toolbar {
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .resume-toolbar .spacer { flex: 1 1 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="resume-page">
    <div class="container">
        <div class="resume-wrap">
            <div class="resume-toolbar">
                {% for item in resumes %}
                <button type="button"
                        class="resume-btn{% if item.name == resume_name %} active{% endif %}"
                        data-resume="{{ item.name }}"
                        title="{{ item.blurb }}">{{ item.label }}</button>
                {% endfor %}
                <span class="spacer"></span>
                <button type="button" title="Save as PDF" onclick="printResume()">
                    <i class="fas fa-download"></i>
                </button>
                <button type="button" title="Print" onclick="printResume()">
                    <i class="fas fa-print"></i>
                </button>
            </div>

            <div class="resume-sheet">
                <iframe id="frame-1" data-page="1" src="{{ url_for('resume_blueprint.view', page=1, resume=resume_name) }}" title="Resume page 1"></iframe>
            </div>
            <div class="resume-sheet">
                <iframe id="frame-2" data-page="2" src="{{ url_for('resume_blueprint.view', page=2, resume=resume_name) }}" title="Resume page 2"></iframe>
            </div>
        </div>
    </div>
</div>

<iframe id="print-frame" style="position:absolute; width:0; height:0; border:0; visibility:hidden;" title="Print"></iframe>

<script>
    let currentResume = {{ resume_name | tojson }};

    function iframeUrl(page) {
        return "{{ url_for('resume_blueprint.view') }}" + '?page=' + page + '&resume=' + encodeURIComponent(currentResume);
    }

    function printResume() {
        const printFrame = document.getElementById('print-frame');
        printFrame.src = "{{ url_for('resume_blueprint.view') }}" + '?resume=' + encodeURIComponent(currentResume);
        printFrame.onload = function() {
            printFrame.contentWindow.focus();
            printFrame.contentWindow.print();
        };
    }

    function setResume(name) {
        currentResume = name;
        document.querySelectorAll('.resume-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.resume === name);
        });
        document.getElementById('frame-1').src = iframeUrl(1);
        document.getElementById('frame-2').src = iframeUrl(2);
    }

    document.querySelectorAll('.resume-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            setResume(btn.dataset.resume);
        });
    });
</script>
{% endblock %}
