{% extends "base.html" %}

{% block title %}Resume | Nova{% endblock %}

{% block head_extra %}
<style>
    .resume-page {
        background: #e9ecef;
        padding: 2rem 0 4rem;
    }
    .resume-wrap {
        margin: 0 auto;
        max-width: 900px;
    }
    .resume-frame {
        width: 100%;
        height: 297mm;
        max-height: 92vh;
        display: block;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        background: #ffffff;
    }
    .resume-toolbar {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-bottom: 0.75rem;
    }
    .resume-toolbar a,
    .resume-toolbar button {
        width: 2.5rem;
        height: 2.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(10, 10, 15, 0.15);
        border-radius: 50%;
        background: #ffffff;
        color: var(--bg-primary);
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .resume-toolbar a:hover,
    .resume-toolbar button:hover {
        background: var(--accent);
        color: var(--bg-primary);
        border-color: var(--accent);
    }
</style>
{% endblock %}

{% block content %}
<div class="resume-page">
    <div class="container">
        <div class="resume-wrap">
            <div class="resume-toolbar">
                <a href="{{ url_for('static', filename='assets/images/resume.pdf') }}" download="resume.pdf" title="Download PDF">
                    <i class="fas fa-download"></i>
                </a>
                <button type="button" title="Print" onclick="printResume()">
                    <i class="fas fa-print"></i>
                </button>
            </div>
            <iframe id="resume-frame" class="resume-frame" src="{{ url_for('static', filename='assets/images/resume.pdf') }}" title="Resume"></iframe>
        </div>
    </div>
</div>

<script>
    function printResume() {
        const frame = document.getElementById('resume-frame');
        if (frame && frame.contentWindow) {
            frame.contentWindow.focus();
            frame.contentWindow.print();
        }
    }
</script>
{% endblock %}
