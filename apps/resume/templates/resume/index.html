{% extends "base.html" %}

{% block title %}Resume | Nova{% endblock %}

{% block head_extra %}
<style>
    .resume-page {
        background: #e9ecef;
        padding: 2rem 0 4rem;
    }
    .resume-frame {
        width: 100%;
        max-width: 210mm;
        height: 297mm;
        max-height: 90vh;
        margin: 0 auto;
        display: block;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        background: #ffffff;
    }
</style>
{% endblock %}

{% block content %}
<div class="resume-page">
    <div class="container">
        <div class="text-center mb-3">
            <a href="{{ url_for('static', filename='assets/images/resume.pdf') }}" target="_blank" class="btn btn-accent save-btn">
                <i class="fas fa-download mr-1"></i>Download PDF
            </a>
        </div>

        <iframe class="resume-frame" src="{{ url_for('static', filename='assets/images/resume.pdf') }}" title="Resume"></iframe>
    </div>
</div>
{% endblock %}
