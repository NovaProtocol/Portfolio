{% extends "base.html" %}

{% block title %}Resume | Nova{% endblock %}

{% block head_extra %}
<style>
    .resume-page {
        background: #e9ecef;
        padding: 2rem 0 4rem;
    }
    .resume-wrap {
        margin: 0 auto;
        max-width: 900px;
    }
    .resume-toolbar {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-bottom: 0.75rem;
    }
    .resume-toolbar button {
        width: 2.5rem;
        height: 2.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(10, 10, 15, 0.15);
        border-radius: 50%;
        background: #ffffff;
        color: var(--bg-primary);
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .resume-toolbar button:hover {
        background: var(--accent);
        color: var(--bg-primary);
        border-color: var(--accent);
    }
    .resume-sheet {
        width: 100%;
        display: block;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        background: #ffffff;
        margin-bottom: 1.5rem;
    }
    .resume-sheet:last-child { margin-bottom: 0; }
    .resume-sheet iframe {
        width: 100%;
        height: 1123px;
        border: 0;
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="resume-page">
    <div class="container">
        <div class="resume-wrap">
            <div class="resume-toolbar">
                <button type="button" title="Save as PDF" onclick="printResume()">
                    <i class="fas fa-download"></i>
                </button>
                <button type="button" title="Print" onclick="printResume()">
                    <i class="fas fa-print"></i>
                </button>
            </div>

            <div class="resume-sheet">
                <iframe src="{{ url_for('resume_blueprint.view_page', page=1) }}" title="Resume page 1"></iframe>
            </div>
            <div class="resume-sheet">
                <iframe src="{{ url_for('resume_blueprint.view_page', page=2) }}" title="Resume page 2"></iframe>
            </div>
        </div>
    </div>
</div>

<iframe id="print-frame" style="position:absolute; width:0; height:0; border:0; visibility:hidden;" title="Print"></iframe>

<script>
    function printResume() {
        const printFrame = document.getElementById('print-frame');
        printFrame.src = "{{ url_for('resume_blueprint.view') }}";
        printFrame.onload = function() {
            printFrame.contentWindow.focus();
            printFrame.contentWindow.print();
        };
    }
</script>
{% endblock %}
