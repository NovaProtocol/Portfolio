{% extends "base.html" %}

{% block title %}Resume | Nova{% endblock %}

{% block head_extra %}
<style>
    .resume-page {
        background: #e9ecef;
        padding: 2rem 0 4rem;
    }
    .resume-wrap {
        margin: 0 auto;
        max-width: 900px;
    }
    .resume-toolbar {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-bottom: 0.75rem;
    }
    .resume-toolbar button {
        min-width: 2.5rem;
        height: 2.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(10, 10, 15, 0.15);
        border-radius: 50%;
        background: #ffffff;
        color: var(--bg-primary);
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .resume-toolbar button:hover {
        background: var(--accent);
        color: var(--bg-primary);
        border-color: var(--accent);
    }
    .resume-toolbar button.theme-btn.active {
        background: var(--accent);
        color: var(--bg-primary);
        border-color: var(--accent);
    }
    .resume-sheet {
        width: 794px;
        display: block;
        margin: 0 auto 1.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18);
        background: #ffffff;
    }
    .resume-sheet:last-child { margin-bottom: 0; }
    .resume-sheet iframe {
        width: 794px;
        height: 1123px;
        border: 0;
        display: block;
    }
</style>
{% endblock %}

{% block content %}
<div class="resume-page">
    <div class="container">
        <div class="resume-wrap">
            <div class="resume-toolbar">
                <button type="button" class="theme-btn" data-theme="1" title="Theme 1">1</button>
                <button type="button" class="theme-btn" data-theme="2" title="Theme 2">2</button>
                <button type="button" class="theme-btn active" data-theme="3" title="Theme 3">3</button>
                <button type="button" title="Save as PDF" onclick="printResume()">
                    <i class="fas fa-download"></i>
                </button>
                <button type="button" title="Print" onclick="printResume()">
                    <i class="fas fa-print"></i>
                </button>
            </div>

            <div class="resume-sheet">
                <iframe id="frame-1" data-page="1" src="{{ url_for('resume_blueprint.view', page=1, theme=3) }}" title="Resume page 1"></iframe>
            </div>
            <div class="resume-sheet">
                <iframe id="frame-2" data-page="2" src="{{ url_for('resume_blueprint.view', page=2, theme=3) }}" title="Resume page 2"></iframe>
            </div>
        </div>
    </div>
</div>

<iframe id="print-frame" style="position:absolute; width:0; height:0; border:0; visibility:hidden;" title="Print"></iframe>

<script>
    let currentTheme = 3;

    function iframeUrl(page) {
        return "{{ url_for('resume_blueprint.view') }}" + '?page=' + page + '&theme=' + currentTheme;
    }

    function printResume() {
        const printFrame = document.getElementById('print-frame');
        printFrame.src = "{{ url_for('resume_blueprint.view') }}" + '?theme=' + currentTheme;
        printFrame.onload = function() {
            printFrame.contentWindow.focus();
            printFrame.contentWindow.print();
        };
    }

    function setTheme(theme) {
        currentTheme = theme;
        document.querySelectorAll('.theme-btn').forEach(function(btn) {
            btn.classList.toggle('active', parseInt(btn.dataset.theme, 10) === theme);
        });
        document.getElementById('frame-1').src = iframeUrl(1);
        document.getElementById('frame-2').src = iframeUrl(2);
    }

    document.querySelectorAll('.theme-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            setTheme(parseInt(btn.dataset.theme, 10));
        });
    });
</script>
{% endblock %}
