[project]
name = "portfolio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
lint.ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"apps/projects/routes.py" = ["E501"]
"apps/tags.py" = ["E501"]
"documentation/app.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "documentation"

[tool.yamllint]
extends = "default"
rules.line-length.max = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
